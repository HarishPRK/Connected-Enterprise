# The public Studio is a reverse proxy for gemtek.connectedenterprise.app.
# Translate only a matching Studio chat Origin to the upstream application's
# own origin. Missing, null, foreign origins and other routes pass unchanged
# so the upstream same-origin gate continues to reject them.
map_hash_bucket_size 128;

map $http_origin $gemtek_studio_origin {
    default $http_origin;
    "https://studio.connectedenterprise.app" "https://gemtek.connectedenterprise.app";
}

map $uri $gemtek_studio_agent_origin {
    default $http_origin;
    "/api/twin-agent/chat" $gemtek_studio_origin;
}
